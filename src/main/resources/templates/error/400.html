<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dados inválidos')}"></head>
<body>
<main class="container-xl">
    <div class="erro-caixa">
        <div class="codigo">400</div>
        <h1 class="mt-2"><i class="bi bi-exclamation-triangle"></i> Dados inválidos</h1>
        <p class="text-secondary" th:text="${mensagem != null} ? ${mensagem} : 'Não foi possível abrir esta página.'">mensagem</p>
        <div class="d-flex gap-2 justify-content-center mt-4">
            <a class="btn btn-primary" th:href="@{/}"><i class="bi bi-house"></i> Ir para o início</a>
            <a class="btn btn-outline-secondary" href="javascript:history.back()">Voltar</a>
        </div>
    </div>
</main>
</body>
</html>
