<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cancelar reserva')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<main class="container-xl pagina" style="max-width: 720px">
    <h1 class="mb-3">Cancelar reserva <span class="text-secondary" th:text="${reserva.id}">R0001</span></h1>
    <div class="cartao">
        <p class="mb-3" th:text="${previa.descricao}">descrição</p>
        <div th:if="${previa.cobraMulta and previa.multa.signum() > 0}" class="alert alert-warning">
            <i class="bi bi-exclamation-triangle"></i>
            Faltam <strong th:text="${previa.horasAteInicio} + 'h'">18h</strong> para o início (menos de 24h).
            Será cobrada multa de 50% do valor pago.
        </div>
        <div th:unless="${previa.cobraMulta and previa.multa.signum() > 0}" class="alert alert-success">
            <i class="bi bi-check-circle"></i> Cancelamento sem custo. Faltam <span th:text="${previa.horasAteInicio} + 'h'"></span> para o início.
        </div>
        <div class="resumo-valores mb-3" style="max-width: 360px">
            <span>Valor pago</span><span class="text-end" th:text="${@fmt.moeda(previa.valorPago)}">R$</span>
            <span class="text-danger">Multa</span><span class="text-end text-danger" th:text="${@fmt.moeda(previa.multa)}">R$</span>
            <span class="total">Reembolso</span><span class="total text-end" th:text="${@fmt.moeda(previa.reembolso)}">R$</span>
        </div>
        <form th:action="@{/membro/reservas/{id}/cancelar(id=${reserva.id})}" method="post" class="d-flex gap-2">
            <button class="btn btn-danger" type="submit">Confirmar cancelamento</button>
            <a class="btn btn-outline-secondary" th:href="@{/membro/reservas}">Manter reserva</a>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
