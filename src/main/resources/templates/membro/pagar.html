<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pagar cobrança')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<main class="container-xl pagina" style="max-width: 760px">
    <h1 class="mb-3">Pagar cobrança</h1>
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <div class="cartao">
        <div class="d-flex justify-content-between gap-2">
            <span th:text="${cobranca.descricao}">desc</span>
            <strong class="text-nowrap" th:text="${@fmt.moeda(cobranca.valor)}">R$</strong>
        </div>
        <form th:if="${cobranca.pendente}" th:action="@{/membro/pagamentos/{id}/pagar(id=${cobranca.id})}" th:object="${form}" method="post" novalidate>
            <div th:replace="~{fragments/layout :: pagamento(null)}"></div>
            <button type="button" class="btn btn-link btn-sm px-0" data-cartao-teste>Preencher cartão de teste</button>
            <div class="mt-2 d-flex gap-2">
                <button class="btn btn-primary" type="submit">Pagar agora</button>
                <a class="btn btn-outline-secondary" th:href="@{/membro/pagamentos}">Voltar</a>
            </div>
        </form>
        <p th:unless="${cobranca.pendente}" class="mt-3 mb-0 text-secondary">Esta cobrança não está pendente.</p>
    </div>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
