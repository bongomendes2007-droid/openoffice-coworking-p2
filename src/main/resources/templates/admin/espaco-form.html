<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${espaco != null} ? 'Editar espaço' : 'Novo espaço')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<main class="container-xl pagina" style="max-width: 720px">
    <a class="small" th:href="@{/admin/espacos}"><i class="bi bi-arrow-left"></i> Espaços</a>
    <h1 class="mt-2 mb-3" th:text="${espaco != null} ? 'Editar ' + ${espaco.nome} : 'Novo espaço'">Novo espaço</h1>
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <form class="cartao d-grid gap-3" th:object="${form}" method="post" novalidate
          th:action="${espaco != null} ? @{/admin/espacos/{id}/editar(id=${espaco.id})} : @{/admin/espacos/novo}">
        <div>
            <label class="form-label" for="tipo">Tipo</label>
            <select class="form-select" th:field="*{tipo}" th:errorclass="is-invalid" th:disabled="${espaco != null}">
                <option value="">Escolha...</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.descricao}">tipo</option>
            </select>
            <input th:if="${espaco != null}" type="hidden" name="tipo" th:value="${espaco.tipo}">
            <div class="invalid-feedback" th:errors="*{tipo}"></div>
            <div class="form-text">Sala de reunião R$ 60/h · Sala privada R$ 80/h (só VIP) · Auditório R$ 200/h · Estação incluída no plano.
                <span th:if="${espaco != null}">O tipo não pode ser alterado.</span></div>
        </div>
        <div>
            <label class="form-label" for="nome">Nome</label>
            <input class="form-control" th:field="*{nome}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{nome}"></div>
        </div>
        <div>
            <label class="form-label" for="capacidade">Capacidade (pessoas)</label>
            <input class="form-control" type="number" min="1" th:field="*{capacidade}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{capacidade}"></div>
            <div class="form-text">Estações de trabalho têm sempre capacidade 1.</div>
        </div>
        <div>
            <label class="form-label" for="descricao">Descrição</label>
            <textarea class="form-control" rows="2" th:field="*{descricao}" th:errorclass="is-invalid"></textarea>
            <div class="invalid-feedback" th:errors="*{descricao}"></div>
        </div>
        <div><button class="btn btn-primary" type="submit">Salvar</button></div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
