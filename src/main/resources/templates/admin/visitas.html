<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Visitas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<main class="container-xl pagina">
    <div class="cabecalho"><div><h1>Visitas</h1><p>Visitantes autorizados pelos membros.</p></div></div>
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <section class="cartao mb-3">
        <div class="cartao-titulo"><h2>No espaço agora</h2><span class="selo selo-info" th:text="${#lists.size(ativas)}">2</span></div>
        <div th:if="${#lists.isEmpty(ativas)}" class="text-secondary">Nenhum visitante no espaço.</div>
        <div class="tabela-rolavel" th:unless="${#lists.isEmpty(ativas)}">
            <table class="table">
                <thead><tr><th>Visitante</th><th>Documento</th><th>Autorizado por</th><th>Entrada</th><th>Tempo</th><th></th></tr></thead>
                <tbody>
                <tr th:each="v : ${ativas}">
                    <td th:text="${v.visitanteNome}">nome</td><td th:text="${v.visitanteDocumento}">doc</td>
                    <td><a th:href="@{/admin/membros/{id}(id=${v.membroId})}" th:text="${v.membroNome}">membro</a></td>
                    <td th:text="${@fmt.hora(v.entrada)}">h</td><td th:text="${@fmt.duracao(v.getPermanencia(agora))}">t</td>
                    <td class="text-end"><form th:action="@{/admin/visitas/{id}/saida(id=${v.id})}" method="post">
                        <button class="btn btn-sm btn-outline-secondary" type="submit">Registrar saída</button></form></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
    <section class="cartao">
        <div class="cartao-titulo"><h2>Histórico (últimas 100)</h2>
            <a class="small" th:href="@{/admin/relatorios(tipo='visitas')}">Relatório completo</a></div>
        <div class="tabela-rolavel">
            <table class="table table-sm">
                <thead><tr><th>Visitante</th><th>Documento</th><th>Autorizado por</th><th>Entrada</th><th>Saída</th><th>Permanência</th></tr></thead>
                <tbody>
                <tr th:each="v : ${historico}">
                    <td th:text="${v.visitanteNome}">nome</td><td th:text="${v.visitanteDocumento}">doc</td>
                    <td th:text="${v.membroNome}">membro</td><td th:text="${@fmt.dataHora(v.entrada)}">e</td>
                    <td th:text="${v.saida != null} ? ${@fmt.dataHora(v.saida)} : 'No espaço'">s</td>
                    <td th:text="${@fmt.duracao(v.getPermanencia(agora))}">p</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
