<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar membro')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<main class="container-xl pagina" style="max-width: 720px">
    <a class="small" th:href="@{/admin/membros/{id}(id=${membro.id})}"><i class="bi bi-arrow-left"></i> <span th:text="${membro.nome}">membro</span></a>
    <h1 class="mt-2 mb-3">Editar membro</h1>
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <form class="cartao d-grid gap-3" th:action="@{/admin/membros/{id}/editar(id=${membro.id})}" th:object="${form}" method="post" novalidate>
        <div th:replace="~{fragments/campos-membro :: campos}"></div>
        <div><button class="btn btn-primary" type="submit">Salvar alterações</button></div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
