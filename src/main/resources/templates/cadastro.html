<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Criar conta')}"></head>
<body>
<div class="tela-acesso">
    <section class="acesso-lado">
        <div>
            <div class="marca text-white mb-5"><span class="marca-icone" style="background:#fff;color:#1f6f5c">OO</span> OpenOffice Coworking</div>
            <h1>Crie sua conta de membro.</h1>
            <p class="mt-3" style="max-width:42ch">Depois do cadastro, escolha um plano (diário, semanal, mensal ou VIP) para começar a reservar.</p>
        </div>
        <small class="opacity-75">Seus dados ficam salvos só neste computador.</small>
    </section>
    <section class="acesso-form">
        <div class="caixa">
            <h2 class="h3 mb-3">Cadastro</h2>
            <div th:replace="~{fragments/layout :: alertas}"></div>
            <form th:action="@{/cadastro}" th:object="${form}" method="post" class="d-grid gap-3" novalidate>
                <div th:replace="~{fragments/campos-membro :: campos}"></div>
                <div class="row g-2">
                    <div class="col-sm-6">
                        <label class="form-label" for="senha">Senha</label>
                        <input class="form-control" type="password" th:field="*{senha}" th:errorclass="is-invalid" autocomplete="new-password">
                        <div class="invalid-feedback" th:errors="*{senha}"></div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label" for="confirmacaoSenha">Confirme a senha</label>
                        <input class="form-control" type="password" th:field="*{confirmacaoSenha}"
                               th:classappend="${#fields.hasErrors('senhasIguais')} ? 'is-invalid'" autocomplete="new-password">
                        <div class="invalid-feedback" th:errors="*{senhasIguais}"></div>
                    </div>
                </div>
                <button class="btn btn-primary btn-lg" type="submit">Criar conta</button>
            </form>
            <p class="mt-3 text-center">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
        </div>
    </section>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
