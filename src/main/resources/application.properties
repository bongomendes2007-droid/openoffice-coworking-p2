spring.application.name=openoffice-coworking
server.port=${PORT:8080}

# Lê variáveis do arquivo .env (se existir), por exemplo as credenciais do Google Drive.
spring.config.import=optional:file:.env[.properties]

# Pasta onde ficam os arquivos JSON de dados
openoffice.data-dir=${OPENOFFICE_DATA_DIR:data}
# Cria dados de demonstração na primeira execução
openoffice.dados-demonstracao=true

# Google Drive (desafio). Veja .env.example
google.drive.credentials=${GOOGLE_DRIVE_CREDENTIALS:}
google.drive.folder-name=${GOOGLE_DRIVE_FOLDER_NAME:OpenOffice Coworking - dados}

spring.thymeleaf.cache=false
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
server.servlet.session.timeout=60m
server.servlet.session.tracking-modes=cookie
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=false
spring.main.banner-mode=off
logging.level.root=INFO
